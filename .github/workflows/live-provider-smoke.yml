# Scheduled smoke tests against REAL third-party services (audit P2-9).
#
# Everything marked `@pytest.mark.live` (LLM providers, Tavily, Firecrawl,
# DeepWiki/MCP) lives here instead of in the per-PR CI run, so pull requests
# never spend provider credits or fail because someone else is down.
#
#   * Runs weekly and on demand; never on push/PR.
#   * Uses the repository's provider secrets — keep those keys scoped to
#     low-spend, test-only projects with provider-side budget limits.
#   * Cost cap: the tests use the cheapest models and tiny prompts; the job
#     has a hard 20-minute timeout and a single-run concurrency group.
#   * Skip/failure reporting: the summary lists every skipped test and why,
#     and the run FAILS if nothing actually passed (e.g. all keys missing),
#     so "green because everything skipped" cannot happen silently.
name: Live provider smoke

on:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-provider-smoke
  cancel-in-progress: false

jobs:
  live:
    name: Live-provider tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: composer_test
          POSTGRES_PASSWORD: composer_test
          POSTGRES_DB: composer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U composer_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://composer_test:composer_test@localhost:5432/composer_test
      DATABASE_URL: postgresql://composer_test:composer_test@localhost:5432/composer_test
      JWT_SECRET: ci-test-only-not-a-real-secret
      ENCRYPTION_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      BROWSERLESS_API_KEY: ${{ secrets.BROWSERLESS_API_KEY }}
      LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Generate Prisma client
        run: uv run prisma generate

      - name: Apply migrations
        run: uv run prisma migrate deploy

      - name: Run live-provider tests
        run: |
          uv run pytest -m live --no-cov -rs -p no:cacheprovider \
            --junitxml=live-results.xml

      - name: Report skips and fail if nothing ran
        if: always()
        run: |
          python - <<'PY'
          import os, sys
          import xml.etree.ElementTree as ET

          try:
              suite = ET.parse("live-results.xml").getroot()
          except (OSError, ET.ParseError):
              print("::error::no junit results were produced")
              sys.exit(1)
          cases = list(suite.iter("testcase"))
          skipped = [c for c in cases if c.find("skipped") is not None]
          failed = [c for c in cases if c.find("failure") is not None or c.find("error") is not None]
          passed = len(cases) - len(skipped) - len(failed)
          lines = [
              "## Live provider smoke",
              f"passed **{passed}**, failed **{len(failed)}**, skipped **{len(skipped)}**",
          ]
          for c in skipped:
              reason = c.find("skipped").get("message", "")
              lines.append(f"- skipped `{c.get('classname')}::{c.get('name')}`: {reason}")
          summary = "\n".join(lines)
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write(summary + "\n")
          if passed == 0:
              print("::error::no live-provider test passed - are the provider secrets configured?")
              sys.exit(1)
          PY
