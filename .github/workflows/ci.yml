name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-typecheck-test:
    name: Lint, typecheck, and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: composer_test
          POSTGRES_PASSWORD: composer_test
          POSTGRES_DB: composer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U composer_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://composer_test:composer_test@localhost:5432/composer_test
      DATABASE_URL: postgresql://composer_test:composer_test@localhost:5432/composer_test
      JWT_SECRET: ci-test-only-not-a-real-secret
      ENCRYPTION_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      # Phase 2: LLM + Tavily keys (from repo secrets). Tests skip gracefully
      # when a secret isn't set.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      BROWSERLESS_API_KEY: ${{ secrets.BROWSERLESS_API_KEY }}
      LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Generate Prisma client
        run: uv run prisma generate

      - name: Apply migrations
        run: uv run prisma migrate deploy

      - name: Lint (ruff)
        run: uv run ruff check src tests

      - name: Format check (ruff)
        run: uv run ruff format --check src tests

      - name: Type check (pyright)
        run: uv run pyright src tests

      - name: Unit tests
        run: uv run pytest -m "not integration"

      # Must run right after the unit tests: the integration step below also
      # writes coverage.xml and would overwrite it. Per-module floors stop a
      # healthy aggregate from hiding an untested critical path (audit P2-8).
      - name: Coverage floors (per module)
        run: uv run python -m tests.coverage_floors coverage.xml --floors coverage-floors.json

      # Postgres-backed integration tests only. Tests that call credentialed
      # third-party services are marked `live` and run on a schedule instead
      # (.github/workflows/live-provider-smoke.yml) so a PR never spends
      # provider credits or flakes on someone else's outage (audit P2-9).
      - name: Integration tests
        run: uv run pytest -m "integration and not live"

  # ─── Frontend (audit P1-3) ───────────────────────────────────────────
  # The frontend used to be invisible to CI: formatting drifted across 102
  # files while every backend check stayed green. Lockfile-resolved install,
  # then the same gates a developer runs locally.
  frontend:
    name: Frontend (format, types, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install (lockfile)
        run: npm ci

      - name: Format check (Prettier)
        run: npm run format:check

      - name: Type check (tsc)
        run: npm run type-check

      - name: Unit tests (Vitest)
        run: npm test

      - name: Production build
        env:
          NEXT_PUBLIC_COMPOSER_API_URL: https://api.example.test
        run: npm run build

  # ─── Dependency + secret scanning (audit P0-2 / P1-4) ────────────────
  # Fails on any unreviewed advisory in the lockfile-resolved production
  # dependency set. Exceptions live in security/audit-allowlist.json and must
  # carry an owner, rationale, surface and an expiry <= 365 days out
  # (src/security/dependency_audit.py). Reports are kept as an artifact.
  dependency-audit:
    name: Dependency audit (pip-audit + npm audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Audit locked Python production dependencies
        run: |
          mkdir -p audit-reports
          uv export --frozen --no-dev --no-hashes --no-emit-project -o audit-reports/requirements.txt
          # pip-audit exits 1 when it finds advisories; the gate below decides.
          uvx --from pip-audit==2.10.1 pip-audit -r audit-reports/requirements.txt \
            --no-deps --disable-pip -f json -o audit-reports/pip-audit.json || true
          test -s audit-reports/pip-audit.json
          python -m src.security.dependency_audit pypi audit-reports/pip-audit.json \
            --allowlist security/audit-allowlist.json --report audit-reports/pip-audit-report.md

      - name: Audit npm production dependencies
        run: |
          npm ci --ignore-scripts --prefix frontend
          npm audit --omit=dev --json --prefix frontend > audit-reports/npm-audit.json || true
          test -s audit-reports/npm-audit.json
          python -m src.security.dependency_audit npm audit-reports/npm-audit.json \
            --allowlist security/audit-allowlist.json --report audit-reports/npm-audit-report.md

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-audit-reports
          path: audit-reports/
          retention-days: 90

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # Pinned by digest; rules + the reviewed placeholder allowlist live in
      # .gitleaks.toml. Scans every commit, so a secret that was committed and
      # later deleted still fails.
      - name: Scan git history
        run: |
          mkdir -p scan-reports
          docker run --rm -v "$PWD:/repo" -v "$PWD/scan-reports:/out" \
            ghcr.io/gitleaks/gitleaks:v8.30.0@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9 \
            git /repo --config /repo/.gitleaks.toml --redact --no-banner --exit-code 1 \
            --report-format json --report-path /out/gitleaks.json

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-report
          path: scan-reports/
          retention-days: 90

  # ─── Container scanning (audit P1-4) ─────────────────────────────────
  # Builds both runtime images exactly as the deploy workflow does and fails
  # on any FIXABLE high/critical vulnerability (OS packages and language
  # packages). Exceptions go in .trivyignore.yaml with an expiry date.
  container-scan:
    name: Container scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: composer-backend:scan
          cache-from: type=gha,scope=scan-backend
          cache-to: type=gha,mode=max,scope=scan-backend

      - name: Build frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: frontend
          file: frontend/Dockerfile
          load: true
          tags: composer-frontend:scan
          build-args: |
            NEXT_PUBLIC_COMPOSER_API_URL=https://api.example.test
          cache-from: type=gha,scope=scan-frontend
          cache-to: type=gha,mode=max,scope=scan-frontend

      - name: Scan images
        run: |
          mkdir -p scan-reports
          failed=0
          for image in backend frontend; do
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD/.trivyignore.yaml:/.trivyignore.yaml:ro" \
              -v "$PWD/scan-reports:/out" \
              aquasec/trivy:0.58.0@sha256:b88012e2a0a309d6a8a00463d4e63e5e513377fb74eccbc8f9b0f8f81940ebeb \
              image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
              --ignorefile /.trivyignore.yaml --exit-code 1 \
              --format table --output "/out/trivy-$image.txt" "composer-$image:scan" \
              || failed=1
            cat "scan-reports/trivy-$image.txt"
          done
          exit "$failed"

      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-reports
          path: scan-reports/
          retention-days: 90

  # ─── Browser smoke (audit P1-3) ──────────────────────────────────────
  # Real Postgres + real uvicorn + a PRODUCTION Next build served by
  # `next start`, driven by Playwright/chromium. Production mode matters:
  # security-headers.spec.ts asserts HSTS and no 'unsafe-eval', which only
  # hold outside `next dev`.
  #
  # Deliberately a SMOKE subset (auth + security headers). The remaining
  # specs (designer, admin, end-user, external-invoke, decision-node,
  # date-field) are heavier, need LLM/tool configuration, and are the
  # candidates for a nightly job rather than every PR.
  e2e-smoke:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: composer_test
          POSTGRES_PASSWORD: composer_test
          POSTGRES_DB: composer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U composer_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://composer_test:composer_test@localhost:5432/composer_test
      JWT_SECRET: ci-e2e-smoke-only-not-a-real-secret-0123456789
      ENCRYPTION_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      # development => /internal/test-users/me exists (e2e user cleanup) and
      # CORS allows the browser origin.
      ENVIRONMENT: development
      NEXT_PUBLIC_COMPOSER_API_URL: http://localhost:8000

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: uv sync --all-extras

      - name: Generate Prisma client
        run: uv run prisma generate

      - name: Apply migrations
        run: uv run prisma migrate deploy

      - name: Start backend
        run: |
          nohup uv run uvicorn src.main:app --port 8000 > "$RUNNER_TEMP/uvicorn.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health > /dev/null; then
              echo "backend up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "backend never became healthy; log follows"
          cat "$RUNNER_TEMP/uvicorn.log"
          exit 1

      - name: Install frontend dependencies (lockfile)
        working-directory: frontend
        run: npm ci

      - name: Build frontend (production)
        working-directory: frontend
        run: npm run build

      - name: Start frontend
        working-directory: frontend
        env:
          NEXTAUTH_SECRET: ci-e2e-smoke-only-not-a-real-secret-0123456789
          AUTH_SECRET: ci-e2e-smoke-only-not-a-real-secret-0123456789
          NEXTAUTH_URL: http://localhost:3000
          AUTH_TRUST_HOST: "true"
        run: |
          nohup npx next start -p 3000 > "$RUNNER_TEMP/next.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:3000/login; then
              echo "frontend up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "frontend never became ready; log follows"
          cat "$RUNNER_TEMP/next.log"
          exit 1

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run smoke specs
        working-directory: frontend
        env:
          CI: "true"
          PW_BASE_URL: http://localhost:3000
        run: npx playwright test e2e/auth.spec.ts e2e/security-headers.spec.ts

      - name: Upload Playwright artifacts and server logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-smoke-diagnostics
          path: |
            frontend/playwright-report/
            frontend/test-results/
            ${{ runner.temp }}/uvicorn.log
            ${{ runner.temp }}/next.log
          if-no-files-found: ignore
          retention-days: 14
