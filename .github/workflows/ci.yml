name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck-test:
    name: Lint, typecheck, and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: composer_test
          POSTGRES_PASSWORD: composer_test
          POSTGRES_DB: composer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://composer_test:composer_test@localhost:5432/composer_test
      DATABASE_URL: postgresql://composer_test:composer_test@localhost:5432/composer_test
      JWT_SECRET: ci-test-only-not-a-real-secret
      ENCRYPTION_KEY: "00000000000000000000000000000000000000000000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Generate Prisma client
        run: uv run prisma generate

      - name: Apply migrations
        run: uv run prisma migrate deploy

      - name: Lint (ruff)
        run: uv run ruff check src tests

      - name: Format check (ruff)
        run: uv run ruff format --check src tests

      - name: Type check (pyright)
        run: uv run pyright src tests

      - name: Unit tests
        run: uv run pytest -m "not integration"

      - name: Integration tests
        run: uv run pytest -m integration
