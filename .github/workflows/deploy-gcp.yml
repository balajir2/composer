# Auto-deploy Composer to Google Cloud Run on every push to main.
#
# Setup (one-time): see docs/operations/gcp-cloud-run-setup.md §"GitHub
# Actions CI/CD".  Summary:
#   1. Create a JSON key for the composer-deployer service account.
#   2. Add it as a GitHub Actions secret named `GCP_SA_KEY`.
#   3. Add the public API URL as a repository variable named
#      `COMPOSER_API_URL` (e.g. https://api.composer.example.com or
#      https://composer-backend-<hash>-uc.a.run.app).
#   4. (Optional) Add the public frontend URL as `COMPOSER_FRONTEND_URL`
#      so NEXTAUTH_URL points at the right host.
#
# The workflow assumes the bootstrap script has already run (Secret
# Manager populated, Cloud Run services exist).  Day-to-day pushes
# only rebuild + redeploy the containers.

name: Deploy to GCP Cloud Run

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: "Deploy backend"
        type: boolean
        default: true
      deploy_frontend:
        description: "Deploy frontend"
        type: boolean
        default: true

env:
  PROJECT_ID: composer-497608
  REGION: us-central1
  ARTIFACT_REPO: composer
  BACKEND_SERVICE: composer-backend
  FRONTEND_SERVICE: composer-frontend

jobs:
  deploy-backend:
    name: Build + deploy backend
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.inputs.deploy_backend == 'true' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker auth for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/backend:${{ github.sha }}
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/backend:latest
          # GHA cache: scoped per image so backend + frontend don't clobber each
          # other.  `mode=max` exports intermediate layers too — important
          # because our Dockerfile is single-stage with several expensive
          # layers (apt+node install, uv sync, prisma generate).
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Export backend image ref
        run: |
          echo "BACKEND_IMAGE=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/backend:${{ github.sha }}" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.BACKEND_SERVICE }} \
            --image="$BACKEND_IMAGE" \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --platform=managed \
            --quiet

      - name: Print backend URL
        run: |
          URL=$(gcloud run services describe ${{ env.BACKEND_SERVICE }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --format='value(status.url)')
          echo "Backend deployed: $URL"
          echo "BACKEND_URL=$URL" >> $GITHUB_STEP_SUMMARY

      - name: Smoke test /health
        run: |
          URL=$(gcloud run services describe ${{ env.BACKEND_SERVICE }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --format='value(status.url)')
          # Health probe may need a moment for traffic to roll over.
          for i in 1 2 3 4 5; do
            if curl -fsS --max-time 30 "$URL/health" > /dev/null; then
              echo "Health probe passed"
              exit 0
            fi
            echo "Health probe attempt $i failed, retrying in 5s..."
            sleep 5
          done
          echo "Health probe never passed" >&2
          exit 1

  deploy-frontend:
    name: Build + deploy frontend
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.inputs.deploy_frontend == 'true' }}
    needs: deploy-backend   # frontend bakes the backend URL at build time
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker auth for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Resolve backend URL for build-arg
        id: api
        run: |
          # Prefer the COMPOSER_API_URL repository variable (custom domain).
          # Fall back to the backend's *.run.app URL if not set.
          if [ -n "${{ vars.COMPOSER_API_URL }}" ]; then
            URL="${{ vars.COMPOSER_API_URL }}"
          else
            URL=$(gcloud run services describe ${{ env.BACKEND_SERVICE }} \
              --region=${{ env.REGION }} \
              --project=${{ env.PROJECT_ID }} \
              --format='value(status.url)')
          fi
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "Frontend will call API at: $URL"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_COMPOSER_API_URL=${{ steps.api.outputs.url }}
          tags: |
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/frontend:${{ github.sha }}
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/frontend:latest
          # If the backend URL changes, only the layers that consume the
          # build-arg invalidate — earlier layers (npm install, etc.) stay
          # cached.
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Export frontend image ref
        run: |
          echo "FRONTEND_IMAGE=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/frontend:${{ github.sha }}" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.FRONTEND_SERVICE }} \
            --image="$FRONTEND_IMAGE" \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --platform=managed \
            --quiet

      - name: Update NEXTAUTH_URL if configured
        if: vars.COMPOSER_FRONTEND_URL != ''
        run: |
          gcloud run services update ${{ env.FRONTEND_SERVICE }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --update-env-vars="NEXTAUTH_URL=${{ vars.COMPOSER_FRONTEND_URL }}" \
            --quiet

      - name: Print frontend URL
        run: |
          URL=$(gcloud run services describe ${{ env.FRONTEND_SERVICE }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --format='value(status.url)')
          echo "Frontend deployed: $URL"
          echo "FRONTEND_URL=$URL" >> $GITHUB_STEP_SUMMARY

  update-backend-cors:
    name: Update backend CORS allowlist
    runs-on: ubuntu-latest
    needs: deploy-frontend
    if: ${{ github.event_name == 'push' || github.event.inputs.deploy_frontend == 'true' }}
    permissions:
      contents: read
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Resolve frontend origins
        id: origins
        run: |
          # Always allow the *.run.app URL — even when a custom domain is
          # used, the Run URL stays valid and admins occasionally hit it
          # for smoke tests.  If COMPOSER_FRONTEND_URL is set as a repo
          # variable, append that too.
          RUN_URL=$(gcloud run services describe ${{ env.FRONTEND_SERVICE }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --format='value(status.url)')
          ORIGINS="$RUN_URL"
          if [ -n "${{ vars.COMPOSER_FRONTEND_URL }}" ] && [ "${{ vars.COMPOSER_FRONTEND_URL }}" != "$RUN_URL" ]; then
            ORIGINS="$ORIGINS,${{ vars.COMPOSER_FRONTEND_URL }}"
          fi
          echo "origins=$ORIGINS" >> $GITHUB_OUTPUT
          echo "Backend CORS allowlist: $ORIGINS"

      - name: Update backend env
        run: |
          gcloud run services update ${{ env.BACKEND_SERVICE }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --update-env-vars="COMPOSER_FRONTEND_ORIGINS=${{ steps.origins.outputs.origins }}" \
            --quiet
