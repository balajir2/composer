[project]
name = "composer"
version = "0.1.0"
description = "Python rebuild of Open Agent Builder on IE-compatible stack"
authors = [
    { name = "Balaji Rajan", email = "balajirajan@gmail.com" },
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    # Web framework
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.32.0",

    # Validation
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",

    # Database (Prisma Python)
    "prisma>=0.15.0",

    # Postgres LISTEN/NOTIFY (P1-4)
    "asyncpg>=0.32.0",

    # Cloud Tasks (P1-2 durable execution)
    "google-cloud-tasks>=2.26.0",

    # Orchestration
    "langgraph>=1.2.20",
    "langchain>=1.4.9",
    "langchain-core>=0.3.0",
    "langchain-anthropic>=1.7.10",
    "langchain-openai>=1.7.4",
    "langchain-google-genai>=4.4.3",
    "langchain-groq>=1.1.3",

    # MCP / HTTP
    "httpx>=0.28.0",

    # Security
    "cryptography>=44.0.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "simpleeval>=1.0.8",

    # Email validation (Pydantic EmailStr, Phase 7a)
    "email-validator>=2.0.0",

    # Utilities
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",

    # LangSmith tracing
    "langsmith>=0.2.0",

    # Sandboxed code execution
    "e2b-code-interpreter>=2.11.9",

    # Document parsing (for Start node file uploads)
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",

    # Document generation (file-write node — Markdown -> DOCX/PDF)
    "markdown-it-py>=4.2.0",
    "xhtml2pdf>=0.2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=6.0.0",
    "pytest-httpx>=0.30.0",
    "ruff>=0.17.4",
    "pyright>=1.1.414",
    "asyncpg-stubs>=0.31.0",
]

[project.scripts]
composer = "src.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ───────────────────────────────────────────
# Ruff (lint + format)
# ───────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["prisma/generated", ".venv"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "RUF",  # Ruff-specific
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
]
ignore = [
    "E501",  # line-too-long (handled by formatter)
    "B008",  # FastAPI depends pattern
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ───────────────────────────────────────────
# Pyright (type check — strict from day 0)
# ───────────────────────────────────────────
[tool.pyright]
include = ["src", "tests"]
exclude = ["prisma/generated", ".venv", "**/__pycache__"]
typeCheckingMode = "strict"
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
reportMissingImports = "error"
reportMissingTypeStubs = "warning"
# Accept some flexibility for now; tighten as the codebase stabilizes.
reportUnknownMemberType = "warning"
reportUnknownArgumentType = "warning"
reportUnknownVariableType = "warning"

# ───────────────────────────────────────────
# Pytest
# ───────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
# New application-owned deprecations fail CI. Later entries win.
filterwarnings = [
    "error::DeprecationWarning:src",
    "error::pydantic.warnings.PydanticDeprecatedSince20",
]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=xml",
]
markers = [
    "integration: end-to-end tests that require a provisioned Postgres (run on every PR)",
    "live: tests that call credentialed third-party services (LLM providers, MCP servers); run on a schedule by live-provider-smoke.yml, not on every PR",
    "slow: tests that take longer than a few seconds",
]

[tool.coverage.run]
branch = true
source = ["src"]
omit = [
    "src/main.py",
    "prisma/generated/**",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
